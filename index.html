<!DOCTYPE html>
<html>

<head>

<title>Stock Market Dashboard</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
text-align:center;
}

header{
background:#020617;
padding:20px;
font-size:30px;
}

.market{
background:#22c55e;
padding:10px;
font-weight:bold;
}

.container{
padding:40px;
}

input{
width:60%;
padding:12px;
border-radius:6px;
border:none;
}

button{
padding:12px 20px;
margin-top:10px;
background:#22c55e;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

.premium{
margin-top:40px;
background:#1e293b;
padding:30px;
border-radius:10px;
width:60%;
margin-left:auto;
margin-right:auto;
}

</style>

</head>

<body>

<header>
Stock Market Dashboard
</header>

<div class="market">
Market Status: OPEN
</div>

<div class="container">

<h2>Search Stock</h2>

<input id="search" placeholder="Type company name (Apple)">
<br><br>

<button onclick="searchStock()">Search</button>

<div id="chart"></div>

</div>

<div class="premium">

<h2>Upgrade to Premium</h2>

<p>Premium users get:</p>

<ul style="list-style:none;padding:0">
<li>⚡ Faster charts</li>
<li>📈 Advanced indicators</li>
<li>🚀 Better performance</li>
<li>💎 Premium dashboard features</li>
</ul>

<br>

<button onclick="buyPremium()">Buy Premium ($2/month)</button>

</div>

<script>

function searchStock(){

let company=document.getElementById("search").value.toLowerCase().trim();

let stocks={
"apple":"AAPL",
"meta":"META",
"tesla":"TSLA",
"microsoft":"MSFT",
"amazon":"AMZN",
"google":"GOOGL",
"nvidia":"NVDA"
};

let ticker=stocks[company];

if(!ticker){
alert("Company not supported yet.");
return;
}

document.getElementById("chart").innerHTML =
'<iframe width="100%" height="500" src="https://s.tradingview.com/widgetembed/?symbol='+ticker+'&interval=D&theme=dark"></iframe>';

}

function buyPremium(){

window.location.href="https://buy.stripe.com/test_7sYaEQ8KTbXf47X8035Vu00";

}

</script>

</body>
</html>
