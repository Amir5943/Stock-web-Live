<!DOCTYPE html>
<html>

<head>

<title>Stock Market Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

Stock Market Dashboard

<div class="clock" id="clock"></div>

</header>

<!-- LOGIN -->

<div class="login" id="loginBox">

<h2>Login</h2>

<input id="username" placeholder="Username">
<br>

<input id="password" type="password" placeholder="Password">
<br><br>

<button onclick="login()">Login</button>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<div class="topbar">

<button onclick="logout()">Logout</button>

<div class="status" id="marketStatus">
Market Status: Checking...
</div>

</div>

<!-- SEARCH -->

<div class="search">

<input id="searchStock" placeholder="Search stock ticker (example: AAPL)">

<button onclick="searchStock()">Search</button>

</div>

<!-- STOCK GRID -->

<div class="grid"></div>

<!-- NEWS -->

<div class="news">

<h3>Market News</h3>

<p>Latest financial news will appear here.</p>

</div>

</div>

<footer>

Live Stock Viewer • Market Dashboard

</footer>

<script src="script.js"></script>

<script>

function login(){

let user = document.getElementById("username").value
let pass = document.getElementById("password").value

if(user === "" || pass === ""){
alert("No letters or numbers detected")
return
}

document.getElementById("loginBox").style.display="none"
document.getElementById("dashboard").style.display="block"

}

function logout(){

document.getElementById("loginBox").style.display="block"
document.getElementById("dashboard").style.display="none"

}

function updateClock(){

let now = new Date()

document.getElementById("clock").innerText =
now.toLocaleTimeString()

}

setInterval(updateClock,1000)

function searchStock(){

let ticker = document.getElementById("searchStock").value.toUpperCase()

if(ticker===""){
alert("Enter a stock ticker")
return
}

alert("Searching for: " + ticker)

}

function marketStatus(){

let hour = new Date().getHours()

if(hour >= 9 && hour <= 16){

document.getElementById("marketStatus").innerText =
"Market Status: OPEN"

}else{

document.getElementById("marketStatus").innerText =
"Market Status: CLOSED"

}

}

marketStatus()

document.addEventListener("keypress",function(e){

if(e.key==="Enter"){
login()
}

})

</script>

</body>

</html>
