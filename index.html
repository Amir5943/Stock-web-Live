<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Market Dashboard</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
margin:0;
}

header{
background:#020617;
text-align:center;
padding:20px;
font-size:28px;
}

.market{
background:#22c55e;
padding:8px;
text-align:center;
font-weight:bold;
}

.container{
padding:30px;
text-align:center;
}

input{
width:60%;
padding:12px;
border-radius:6px;
border:none;
margin-top:10px;
}

button{
padding:12px 20px;
margin-top:10px;
background:#22c55e;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

#chart{
margin-top:30px;
}

.news{
margin-top:40px;
background:#1e293b;
padding:20px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
Stock Market Dashboard
</header>

<div class="market" id="marketStatus">
Loading market status...
</div>

<div class="container">

<h2>Search Any Company</h2>

<input id="search" placeholder="Type company name (Apple, Tesla, Meta)">
<br>

<button onclick="searchStock()">Search</button>

<div id="chart"></div>

<div class="news">
<h3>Market News</h3>
<p>Latest financial news will appear here.</p>
</div>

</div>

<script>

// Market open/close check
function updateMarket(){

let hour = new Date().getHours();

if(hour >= 9 && hour <= 16){
document.getElementById("marketStatus").innerText = "Market Status: OPEN";
}else{
document.getElementById("marketStatus").innerText = "Market Status: CLOSED";
}

}

updateMarket();


// Search stock by company name
async function searchStock(){

let company = document.getElementById("search").value;

let response = await fetch(
"https://query1.finance.yahoo.com/v1/finance/search?q=" + company
);

let data = await response.json();

if(data.quotes.length === 0){

alert("Company not found");

return;

}

let ticker = data.quotes[0].symbol;

document.getElementById("chart").innerHTML =
'<iframe src="https://s.tradingview.com/widgetembed/?symbol='
+ ticker +
'&interval=D&theme=dark" width="100%" height="500"></iframe>';

}

</script>

</body>
</html>
