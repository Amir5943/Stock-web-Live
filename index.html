<!DOCTYPE html>
<html>
<head>
<title>Stock Market Dashboard</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

header{
background:#020617;
padding:20px;
text-align:center;
font-size:28px;
}

.market{
background:#22c55e;
text-align:center;
padding:8px;
}

.container{
padding:40px;
text-align:center;
}

input{
width:60%;
padding:12px;
border-radius:6px;
border:none;
}

button{
padding:12px 20px;
margin-top:10px;
background:#22c55e;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

#chart{
margin-top:30px;
}
</style>

</head>

<body>

<header>
Stock Market Dashboard
</header>

<div class="market">
Market Status: OPEN
</div>

<div class="container">

<h2>Search Company</h2>

<input id="search" placeholder="Type company name (Apple)">
<br>

<button id="searchBtn">Search</button>

<div id="chart"></div>

</div>

<script>

document.getElementById("searchBtn").addEventListener("click", function(){

let company=document.getElementById("search").value.toLowerCase().trim();

let stocks={
"apple":"AAPL",
"meta":"META",
"tesla":"TSLA",
"microsoft":"MSFT",
"amazon":"AMZN",
"google":"GOOGL",
"nvidia":"NVDA",
"netflix":"NFLX"
};

let ticker=stocks[company];

if(!ticker){
alert("Company not supported yet");
return;
}

document.getElementById("chart").innerHTML =
'<iframe width="100%" height="500" src="https://s.tradingview.com/widgetembed/?symbol='+ticker+'&interval=D&theme=dark"></iframe>';

});

</script>

</body>
</html>
