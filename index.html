<!DOCTYPE html>
<html>
<head>
<title>Stock Market Dashboard</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

header{
background:#020617;
padding:20px;
text-align:center;
font-size:28px;
}

.market{
background:#22c55e;
text-align:center;
padding:8px;
font-weight:bold;
}

.container{
padding:40px;
text-align:center;
}

input{
width:60%;
padding:12px;
border-radius:6px;
border:none;
}

button{
padding:12px 20px;
margin-top:10px;
background:#22c55e;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

#chart{
margin-top:30px;
}

.news{
margin-top:40px;
background:#1e293b;
padding:20px;
border-radius:10px;
}

</style>

</head>

<body>

<header>
Stock Market Dashboard
</header>

<div class="market" id="marketStatus">
Checking Market...
</div>

<div class="container">

<h2>Search Company</h2>

<input id="search" placeholder="Type company name (Apple, Tesla, Meta)">
<br>

<button onclick="searchStock()">Search</button>

<div id="chart"></div>

<div class="news">

<h3>Market News</h3>

<p>Latest financial news will appear here.</p>

</div>

</div>

<script>

function updateMarket(){

let hour = new Date().getHours();

if(hour >= 9 && hour <= 16){
document.getElementById("marketStatus").innerText="Market Status: OPEN";
}else{
document.getElementById("marketStatus").innerText="Market Status: CLOSED";
}

}

updateMarket();


function searchStock(){

let company=document.getElementById("search").value.toLowerCase().trim();

let stocks={

"apple":"AAPL",
"meta":"META",
"tesla":"TSLA",
"microsoft":"MSFT",
"amazon":"AMZN",
"google":"GOOGL",
"nvidia":"NVDA",
"netflix":"NFLX",
"amd":"AMD",
"intel":"INTC"

};

let ticker=stocks[company];

if(!ticker){

alert("Company not supported yet.");

return;

}

document.getElementById("chart").innerHTML=

'<iframe src="https://s.tradingview.com/widgetembed/?symbol='+ticker+'&interval=D&theme=dark" width="100%" height="500"></iframe>';

}

</script>

</body>
</html>
